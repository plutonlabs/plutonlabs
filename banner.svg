<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Pluton Labs. Take the web back from the trackers.">
  <rect width="1200" height="400" fill="#0e0e10"/>

  <!-- left pixel blocks -->
  <rect x="0" y="250" width="110" height="75" fill="#00f0f0"/>
  <rect x="0" y="325" width="110" height="75" fill="#00a8f0"/>
  <rect x="110" y="350" width="50" height="50" fill="#2ef08a"/>

  <!-- right pixel blocks -->
  <rect x="1090" y="250" width="110" height="75" fill="#00b8f0"/>
  <rect x="1090" y="325" width="110" height="75" fill="#14f0c8"/>
  <rect x="1040" y="350" width="50" height="50" fill="#00f0f0"/>

  <!-- stepped shapes -->
  <g transform="translate(1118 196) rotate(-8)" fill="#2ef08a">
    <rect x="0" y="0" width="52" height="26"/>
    <rect x="-16" y="26" width="68" height="26"/>
  </g>
  <g transform="translate(560 346)" fill="#00f0f0">
    <rect x="0" y="0" width="30" height="54"/>
    <rect x="30" y="20" width="30" height="34"/>
  </g>
  <g transform="translate(868 332) rotate(38)" fill="#2ef08a">
    <rect x="0" y="0" width="46" height="46"/>
    <rect x="46" y="0" width="22" height="22" fill="#0e0e10"/>
  </g>

  <!-- text -->
  <g font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="96" font-size="15" font-weight="600" letter-spacing="5" fill="#8a8a85">PLUTON LABS</text>
    <text x="600" y="188" font-size="82" font-weight="700" letter-spacing="-3" fill="#f5f5ee">Take the web back</text>
    <text x="600" y="274" font-size="82" font-weight="700" letter-spacing="-3" fill="#f5f5ee">from the trackers.</text>
    <text x="600" y="326" font-size="19" fill="#9a9a95">Native Windows browser · Ad &amp; tracker blocking · Open source</text>
  </g>
</svg>
